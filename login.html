<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Giriş | Admin Panel</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="admin-body" style="justify-content: center; align-items: center;">

    <div class="login-container" id="loginStep1">
        <h2
            style="margin-bottom: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Admin Panel Giriş</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="İstifadəçi adı"
                style="width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;"
                required>
            <input type="password" id="password" placeholder="Şifrə"
                style="width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff;"
                required>
            <button type="submit" id="btnContinue" class="admin-btn-save" style="width: 100%;">Daxil ol <i
                    class="fas fa-sign-in-alt"></i></button>
        </form>
        <p id="errorMsg" style="color: #f87171; margin-top: 15px; font-size: 0.9rem; display: none;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB7OScQBGmIm0B7KnXr64ANZsAJ5BQcI5A",
            authDomain: "mywebsite-3d84d.firebaseapp.com",
            projectId: "mywebsite-3d84d",
            storageBucket: "mywebsite-3d84d.appspot.com",
            messagingSenderId: "541643962659",
            appId: "1:541643962659:web:7666eb6830b5c48b217496",
            measurementId: "G-TY3CFBFJ5M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('btnContinue');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Giriş edilir...';
            errorMsg.style.display = 'none';

            const email = user.includes('@') ? user : user + "@admin.com";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'admin.html';
            } catch (error) {
                console.error(error);
                errorMsg.style.display = 'block';
                errorMsg.textContent = "Giriş xətası: " + (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' ? 'İstifadəçi adı və ya şifrə yanlışdır' : error.code);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Daxil ol <i class="fas fa-sign-in-alt"></i>';
            }
        });
    </script>
</body>

</html>
